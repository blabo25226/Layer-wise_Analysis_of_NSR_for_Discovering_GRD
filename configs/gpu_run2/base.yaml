# GPU_RUN2 common run settings. Validation-only choices stay here; test is unused
# until Phase 5 evaluation after every method/layer/budget is frozen.
run_name: gpu_run2_local
python_requires: "3.10"
decode_timeout_sec: 30
parent_timeout_grace_sec: 5
denominator_margin: 1.0e-6
extreme_threshold: 1.0e6
equivalence_nmse_margin: [-0.05, 0.05]
random_3_seed: 20260812
variant_seed: 20260812
n_variants_per_family: 30
n_train_points: 1024
n_eval_points: 256
support_id: [0.1, 2.0]
support_ood: [0.05, 2.5]
noises: [0.0, 0.1]
data_seeds: [101, 202, 303]
model_seeds: [0, 1, 2]
seed_bundles:
  - {data_seed: 101, model_seed: 0}
  - {data_seed: 202, model_seed: 1}
  - {data_seed: 303, model_seed: 2}
gnw_source_commit: "5016f55ab04c111f29d7d0b3a4881d4725d49467"
encoder_layers: 5
candidate_layers_placeholder: 5
conditions: [frozen, full, top_1, top_3, random_3]
output_root: results/runs
graphs_root: graphs
nesymres_weights: assets/nesymres/weights/100M.ckpt
nesymres_config: assets/nesymres/jupyter/100M/config.yaml
nesymres_eq_setting: assets/nesymres/jupyter/100M/eq_setting.json
beam_size: 2
pysr_niterations: 40
# RTX 2070 memory controls: freeze before validation, never change after test starts.
train_batch_size: 16
gradient_accumulation: 1
precision: fp32
fail_fast_on_oom: true
