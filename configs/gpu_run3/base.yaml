campaign: GPU_RUN3
run_name: gpu_run3_local
output_root: results/runs
graphs_root: graphs
provenance: upstream_reproduction

nd2_package_root: third_party/nd2
nd2_checkpoint: assets/nd2/weights/checkpoint.pth
nd2_checkpoint_url: https://github.com/yuzhTHU/ND2/releases/download/checkpoint.pth/checkpoint.pth
nd2_upstream_url: https://github.com/tsinghua-fib-lab/ND2
nd2_weights_repo_url: https://github.com/yuzhTHU/ND2
nd2_zenodo: 10.5281/zenodo.16995963
nd2_synthetic_config: third_party/nd2/config/synthetic.yaml
official_pretrain_csv_dir: data/nd2/pretrain
official_synthetic_data_dir: data/nd2/synthetic

seed_bundles:
  - {data_seed: 101, model_seed: 0}
  - {data_seed: 202, model_seed: 1}
  - {data_seed: 303, model_seed: 2}

analysis_splits:
  train_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2

timeouts:
  policy_forward_sec: 30.0
  formula_rollout_sec: 30.0
  mcts_sec: 120.0
  constant_optimization_sec: 30.0
  ted_sec: 10.0

# KUR's official network file (NorthernEuropeanGrid.csv) ships only in the Zenodo
# archive. When it is absent the simulation falls back to an ER graph of this size
# and records used_er_fallback=true.
kur_fallback_nodes: 50
kur_fallback_edges: 200

smoke:
  # ND2 synthetic benchmark (null => official synthetic.yaml value)
  mcts_episode_limit: 3
  mcts_time_limit_sec: 30
  mcts_time_limit_sec_ft: 20
  n_systems: 2
  simulate_steps: 24
  n_nodes: 6
  n_edges: 10
  # layer-analysis corpus
  n_formulas: 12
  corpus_nodes: 8
  corpus_edges: 20
  corpus_time: 40
  corpus_length_range: [5, 12]
  # analysis budgets
  n_policy_examples: 8
  probe_examples: 16
  panel_problems: 2
  decoderlens_problems: 1
  decoderlens_examples: 4
  mcts_panel_problems: 2
  iole_steps: 2
  ft_steps: 2
  pretrain_catalog_size: 60
  pretrain_size_window: 4
  n_seeds: 1

full:
  # ND2 synthetic benchmark: null keeps the official N / V / E per system
  mcts_episode_limit: 2000
  mcts_time_limit_sec: 300
  mcts_time_limit_sec_ft: 180
  n_systems: 10
  simulate_steps: null
  n_nodes: null
  n_edges: null
  # layer-analysis corpus
  n_formulas: 120
  corpus_nodes: 20
  corpus_edges: 60
  corpus_time: 100
  corpus_length_range: [5, 16]
  # analysis budgets
  n_policy_examples: 256
  probe_examples: 256
  panel_problems: 16
  decoderlens_problems: 12
  decoderlens_examples: 6
  mcts_panel_problems: 4
  iole_steps: 60
  ft_steps: 120
  pretrain_catalog_size: 800
  pretrain_size_window: 4
  n_seeds: 3

fail_fast_on_oom: true
allow_cpu: false
python_required: "3.10"
